[project]
name = "gtui"
version = "0.1.0"
description = "Design intelligence engine: capture an app's visual design language, make it portable, let coding agents apply it."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "grandimam" }]
keywords = ["design-system", "design-tokens", "tailwind", "shadcn", "playwright", "agents"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "playwright>=1.45",
  "rich>=13.7",
]

[project.scripts]
gtui = "gtui.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtui"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line layout

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a Playwright browser"]
